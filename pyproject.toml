[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ofx-to-csv"
version = "0.1.0"
description = "Convert one bank or credit-card OFX statement to transaction CSV."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Zijian Xiao"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["ofx_to_csv*"]
